apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-app-config
  namespace: default
data:
  app.properties: |
    environment=production
    debug=false
    log.level=info
  nginx.conf: |
    server {
        listen 80;
        location / {
            return 200 'Hello from Sample App!';
            add_header Content-Type text/plain;
        }
    }
